[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vpnmanager"
version = "0.1.0"
description = "Orquestador local de clientes VPN oficiales para Windows"
requires-python = ">=3.12"
# Sin dependencias de ejecucion todavia: el nucleo es logica pura. PySide6
# entrara cuando exista la UI, y pywin32 cuando exista el servicio; ninguno
# de los dos debe poder colarse en core/.
dependencies = []

[project.optional-dependencies]
# Herramientas de desarrollo, no se distribuyen con la app:
#   pytest -> tests del nucleo
#   ruff   -> lint y formato en un solo binario, sin cadena de plugins
#   mypy   -> el tipado que exige CLAUDE.md solo sirve si algo lo comprueba
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]
# La interfaz. Aparte para que CI no tenga que instalar Qt entero: nada de lo
# que se prueba en CI necesita un escritorio.
ui = ["PySide6>=6.6"]
# Solo el servidor del pipe y el servicio Windows. El lado cliente del pipe no
# la necesita: en Windows se abre como un fichero.
service = ["pywin32>=306"]

[tool.setuptools.packages.find]
where = ["src"]

# Los .ps1 son codigo, no documentacion: sin ellos el servicio no sabe leer ni
# restaurar la red. Tienen que viajar dentro del paquete.
[tool.setuptools.package-data]
vpnmanager = ["net/ps/*.ps1"]

[tool.pytest.ini_options]
# pythonpath evita tener que instalar el paquete para lanzar los tests.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# La bandeja queda fuera del tipado por la misma razon por la que queda fuera
# de los tests: sin PySide6 instalado no hay nada que comprobar, y PySide6 no
# se instala en CI porque necesita un escritorio. Es el unico fichero exento,
# y por eso tiene que seguir siendo fino: todo lo que decide algo esta en
# ui/client.py, que si se comprueba.
exclude = "src/vpnmanager/(ui/tray|service/pipe)\\.py$"

[[tool.mypy.overrides]]
module = ["PySide6.*", "ntsecuritycon", "win32pipe", "win32api", "win32file", "win32pipe", "win32security", "win32service", "win32serviceutil", "pywintypes", "servicemanager"]
ignore_missing_imports = true
